name: X posts
on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: x-posts
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/fetch_x.py
      - name: Commit new posts
        run: |
          git add x.json assets/x || true
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name=azlartr -c user.email=azlartr@users.noreply.github.com commit -m "Update X posts"
          git pull --rebase -q origin main
          git push
